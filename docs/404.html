<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Sreedhar Busanelli</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center">
        <div class="text-center">
            <div class="mb-8">
                <i class="fas fa-exclamation-triangle text-6xl text-yellow-500 mb-4"></i>
                <h1 class="text-6xl font-bold text-gray-800 mb-4">404</h1>
                <h2 class="text-2xl font-semibold text-gray-700 mb-4">Page Not Found</h2>
                <p class="text-gray-600 mb-8">The page you're looking for doesn't exist or has been moved.</p>
            </div>
            
            <div class="space-y-4">
                <a href="index.html" class="inline-block gradient-bg text-white px-8 py-3 rounded-lg font-semibold hover:opacity-90 transition">
                    <i class="fas fa-home mr-2"></i>Go Home
                </a>
                <div class="text-gray-600">
                    <p>Or visit my main profile:</p>
                    <a href="https://github.com/sbusanelli" class="text-blue-600 hover:text-blue-800 font-semibold">
                        <i class="fab fa-github mr-1"></i>GitHub Profile
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
