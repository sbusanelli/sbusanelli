<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gridGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#gridGradient)"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
    GitHub Contribution Grid
  </text>
  
  <!-- Grid cells -->
  <g id="grid">
    <!-- Week 1 -->
    <rect x="50" y="60" width="100" height="40" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="5"/>
    <text x="100" y="85" text-anchor="middle" fill="white" font-size="12">Week 1</text>
    
    <!-- Week 2 -->
    <rect x="170" y="60" width="100" height="40" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="5"/>
    <text x="220" y="85" text-anchor="middle" fill="white" font-size="12">Week 2</text>
    
    <!-- Week 3 -->
    <rect x="290" y="60" width="100" height="40" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="5"/>
    <text x="340" y="85" text-anchor="middle" fill="white" font-size="12">Week 3</text>
    
    <!-- Week 4 - Highlighted (Current Week) -->
    <rect x="410" y="60" width="100" height="40" fill="rgba(76,175,80,0.3)" stroke="rgba(76,175,80,0.8)" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="460" y="85" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Week 4</text>
    
    <!-- Week 5 -->
    <rect x="530" y="60" width="100" height="40" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="5"/>
    <text x="580" y="85" text-anchor="middle" fill="white" font-size="12">Week 5</text>
    
    <!-- Week 6 -->
    <rect x="650" y="60" width="100" height="40" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="5"/>
    <text x="700" y="85" text-anchor="middle" fill="white" font-size="12">Week 6</text>
    
    <!-- Contribution levels -->
    <text x="100" y="130" text-anchor="middle" fill="white" font-size="14">5</text>
    <text x="220" y="130" text-anchor="middle" fill="white" font-size="14">8</text>
    <text x="340" y="130" text-anchor="middle" fill="white" font-size="14">12</text>
    <text x="460" y="130" text-anchor="middle" fill="white" font-size="14">15</text>
    <text x="580" y="130" text-anchor="middle" fill="white" font-size="14">7</text>
    <text x="700" y="130" text-anchor="middle" fill="white" font-size="14">3</text>
    
    <!-- Legend -->
    <text x="50" y="180" fill="white" font-size="12">Low</text>
    <text x="50" y="200" fill="rgba(255,255,255,0.5)" font-size="10">1-5 contributions</text>
    
    <text x="220" y="180" fill="white" font-size="12">Medium</text>
    <text x="220" y="200" fill="rgba(255,255,255,0.5)" font-size="10">6-10 contributions</text>
    
    <text x="390" y="180" fill="white" font-size="12">High</text>
    <text x="390" y="200" fill="rgba(255,255,255,0.5)" font-size="10">11-20 contributions</text>
    
    <text x="560" y="180" fill="white" font-size="12">Very High</text>
    <text x="560" y="200" fill="rgba(255,255,255,0.5)" font-size="10">21+ contributions</text>
    
    <!-- Current week indicator -->
    <text x="460" y="250" text-anchor="middle" fill="#4CAF50" font-size="12" font-weight="bold">Current Week</text>
  </g>
  
  <!-- Footer -->
  <text x="400" y="380" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="14" font-family="Arial, sans-serif">
    Generated by SRE Toolkit - sbusanelli
  </text>
</svg>
